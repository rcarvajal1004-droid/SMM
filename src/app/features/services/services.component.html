<div class="min-h-screen bg-background">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-on-surface mb-6">Catálogo de Servicios</h1>
    @if (loading) {
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        @for (i of [1,2,3,4,5,6]; track i) {
          <div class="bg-surface rounded-2xl border border-outline-variant p-6 animate-pulse">
            <div class="h-6 bg-outline-variant/30 rounded mb-4"></div>
            <div class="h-4 bg-outline-variant/30 rounded mb-2"></div>
            <div class="h-4 bg-outline-variant/30 rounded"></div>
          </div>
        }
      </div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        @for (service of services; track service.id) {
          <div class="bg-surface rounded-2xl border border-outline-variant p-6 hover:shadow-lg transition-shadow">
            <span class="inline-block px-3 py-1 bg-primary/10 text-primary rounded-full text-xs font-medium mb-3">{{ service.category }}</span>
            <h3 class="text-lg font-semibold text-on-surface mb-2">{{ service.name }}</h3>
            <p class="text-sm text-on-surface-variant mb-4">{{ service.description }}</p>
            <div class="flex justify-between items-center text-sm">
              <span class="text-on-surface-variant">Por 1000:</span>
              <span class="font-bold text-primary">${{ service.ratePer1000 }}</span>
            </div>
            <div class="flex justify-between items-center text-sm mt-1">
              <span class="text-on-surface-variant">Rango:</span>
              <span class="text-on-surface">{{ service.min }} - {{ service.max }}</span>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
