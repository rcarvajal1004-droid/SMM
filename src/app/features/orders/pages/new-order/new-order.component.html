<div class="min-h-screen bg-background">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-on-surface mb-6">Nueva Orden</h1>
    <div class="bg-surface rounded-2xl border border-outline-variant p-8">
      <div class="mb-6">
        <label class="block text-sm font-medium text-on-surface mb-2">Servicio</label>
        <select [(ngModel)]="selectedServiceId" class="w-full px-4 py-3 bg-surface-container rounded-lg border border-outline-variant">
          <option value="">Selecciona un servicio</option>
          @for (service of services; track service.id) {
            <option [value]="service.id">{{ service.name }} - ${{ service.ratePer1000 }}/1000</option>
          }
        </select>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-on-surface mb-2">Enlace</label>
        <input type="url" placeholder="https://..." class="w-full px-4 py-3 bg-surface-container rounded-lg border border-outline-variant">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-on-surface mb-2">Cantidad</label>
        <input type="number" [(ngModel)]="qty" class="w-full px-4 py-3 bg-surface-container rounded-lg border border-outline-variant">
        @if (activeService) {
          <p class="text-xs text-on-surface-variant mt-1">Rango: {{ activeService.min }} - {{ activeService.max }}</p>
        }
      </div>
      <div class="flex justify-between items-center mb-6 p-4 bg-surface-container rounded-lg">
        <span class="text-on-surface-variant">Costo total:</span>
        <span class="text-2xl font-bold text-primary">${{ totalCost() | number:'1.2-2' }}</span>
      </div>
      <button [disabled]="!canSubmit()" class="w-full py-3 bg-primary text-on-primary rounded-lg font-medium disabled:opacity-50 disabled:cursor-not-allowed">
        Realizar Pedido
      </button>
    </div>
  </div>
</div>
