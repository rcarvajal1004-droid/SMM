<header class="fixed top-0 w-full z-50 bg-white/95 dark:bg-[#111827]/95 backdrop-blur-xl border-b border-slate-200 dark:border-slate-700 shadow-xl shadow-slate-900/10 transition-colors duration-300">
  <div class="navbar-shell flex justify-between items-center px-margin-desktop py-4 max-w-container-max mx-auto">
    <div class="navbar-brand flex items-center gap-3">
      <a routerLink="/" class="font-headline-md text-headline-md font-bold text-[#005b7a] dark:text-[#9bdcff] scale-95 active:scale-90 transition-transform no-underline">
        <span class="navbar-brand-full">Refacciones aire acondicionado y venta de Minisplit SMM</span>
        <span class="navbar-brand-short" aria-hidden="true">SMM</span>
      </a>
      <!-- Live Status Badge -->
      <div class="hidden lg:flex items-center gap-2 bg-emerald-500/10 dark:bg-emerald-500/20 border border-emerald-500/30 px-3 py-1 rounded-full">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span class="font-label-md text-xs text-emerald-700 dark:text-emerald-300 font-medium">3 Técnicos en guardia</span>
      </div>
    </div>

    <nav class="navbar-nav hidden md:flex items-center">
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="!text-[#005b7a] dark:!text-[#9bdcff] font-bold border-b-2 border-[#005b7a] dark:border-[#9bdcff] pb-1" class="text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] font-label-md text-label-md hover:bg-sky-500/10 transition-all duration-300 px-1 py-1">Home</a>
      <a routerLink="/hvac-services" routerLinkActive="!text-[#005b7a] dark:!text-[#9bdcff] font-bold border-b-2 border-[#005b7a] dark:border-[#9bdcff] pb-1" class="text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] font-label-md text-label-md hover:bg-sky-500/10 transition-all duration-300 px-1 py-1">HVAC Services</a>
      <a routerLink="/electrical-services" routerLinkActive="!text-[#005b7a] dark:!text-[#9bdcff] font-bold border-b-2 border-[#005b7a] dark:border-[#9bdcff] pb-1" class="text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] font-label-md text-label-md hover:bg-sky-500/10 transition-all duration-300 px-1 py-1">Electrical Services</a>
      <a routerLink="/quote-tool" routerLinkActive="!text-[#005b7a] dark:!text-[#9bdcff] font-bold border-b-2 border-[#005b7a] dark:border-[#9bdcff] pb-1" class="text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] font-label-md text-label-md hover:bg-sky-500/10 transition-all duration-300 px-1 py-1">Quote Tool</a>
      <a routerLink="/booking" routerLinkActive="!text-[#005b7a] dark:!text-[#9bdcff] font-bold border-b-2 border-[#005b7a] dark:border-[#9bdcff] pb-1" class="text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] font-label-md text-label-md hover:bg-sky-500/10 transition-all duration-300 px-1 py-1">Booking</a>
      <a routerLink="/diagnostico" routerLinkActive="!text-[#005b7a] dark:!text-[#9bdcff] font-bold border-b-2 border-[#005b7a] dark:border-[#9bdcff] pb-1" class="text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] font-label-md text-label-md hover:bg-sky-500/10 transition-all duration-300 px-1 py-1">Diagnóstico</a>
      <a routerLink="/ayuda" routerLinkActive="!text-[#005b7a] dark:!text-[#9bdcff] font-bold border-b-2 border-[#005b7a] dark:border-[#9bdcff] pb-1" class="text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] font-label-md text-label-md hover:bg-sky-500/10 transition-all duration-300 px-1 py-1">Centro de ayuda</a>
    </nav>

    <div class="hidden md:flex items-center gap-3">
      <!-- Dark / Light Theme Toggle -->
      <button 
        (click)="toggleTheme()" 
        class="w-10 h-10 rounded-xl bg-surface-container/60 dark:bg-surface-variant/30 hover:bg-surface-container-high border border-outline-variant/30 flex items-center justify-center text-on-surface transition-all active:scale-90"
        [title]="themeService.isDark() ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'"
        aria-label="Cambiar tema"
      >
        <span class="material-symbols-outlined text-xl transition-transform duration-300" [class.rotate-180]="themeService.isDark()">
          {{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}
        </span>
      </button>
    </div>

    <!-- Mobile Action Buttons -->
    <div class="flex md:hidden items-center gap-2">
      <button 
        (click)="toggleTheme()" 
        class="p-2 rounded-lg text-on-surface hover:bg-surface-container"
        aria-label="Cambiar tema"
      >
        <span class="material-symbols-outlined text-xl">
          {{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}
        </span>
      </button>
      <button class="text-primary p-2" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen" aria-label="Abrir menú">
        <span class="material-symbols-outlined">{{ mobileMenuOpen ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div *ngIf="mobileMenuOpen" class="navbar-mobile-drawer md:hidden bg-surface/95 dark:bg-surface-container/95 backdrop-blur-xl border-b border-outline-variant/30 px-6 py-4 space-y-3 animate-fade-in-up">
    <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 px-3 py-1.5 rounded-full w-fit mb-3">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="font-label-md text-xs text-emerald-600 dark:text-emerald-300 font-medium">3 Técnicos de guardia en tu zona</span>
    </div>
    <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()" routerLinkActive="text-[#005b7a] dark:text-[#9bdcff] font-bold" class="block text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] py-2 font-label-md text-label-md">Home</a>
    <a routerLink="/hvac-services" (click)="closeMobileMenu()" routerLinkActive="text-[#005b7a] dark:text-[#9bdcff] font-bold" class="block text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] py-2 font-label-md text-label-md">HVAC Services</a>
    <a routerLink="/electrical-services" (click)="closeMobileMenu()" routerLinkActive="text-[#005b7a] dark:text-[#9bdcff] font-bold" class="block text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] py-2 font-label-md text-label-md">Electrical Services</a>
    <a routerLink="/quote-tool" (click)="closeMobileMenu()" routerLinkActive="text-[#005b7a] dark:text-[#9bdcff] font-bold" class="block text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] py-2 font-label-md text-label-md">Quote Tool</a>
    <a routerLink="/booking" (click)="closeMobileMenu()" routerLinkActive="text-[#005b7a] dark:text-[#9bdcff] font-bold" class="block text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] py-2 font-label-md text-label-md">Booking</a>
    <a routerLink="/diagnostico" (click)="closeMobileMenu()" routerLinkActive="text-[#005b7a] dark:text-[#9bdcff] font-bold" class="block text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] py-2 font-label-md text-label-md">Diagnóstico</a>
    <a routerLink="/ayuda" (click)="closeMobileMenu()" routerLinkActive="text-[#005b7a] dark:text-[#9bdcff] font-bold" class="block text-slate-700 dark:text-slate-200 hover:text-[#005b7a] dark:hover:text-[#9bdcff] py-2 font-label-md text-label-md">Centro de ayuda</a>
  </div>
</header>
