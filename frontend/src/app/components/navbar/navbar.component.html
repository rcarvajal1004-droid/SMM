<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-container/80 backdrop-blur-xl border-b border-white/20 dark:border-outline-variant/20 shadow-xl shadow-slate-900/10 transition-colors duration-300">
  <div class="flex justify-between items-center px-margin-desktop py-4 max-w-container-max mx-auto">
    <div class="flex items-center gap-3">
      <a routerLink="/" class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed scale-95 active:scale-90 transition-transform no-underline">
        ClimaTech &amp; Electricidad
      </a>
      <!-- Live Status Badge -->
      <div class="hidden lg:flex items-center gap-2 bg-emerald-500/10 dark:bg-emerald-500/20 border border-emerald-500/30 px-3 py-1 rounded-full">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span class="font-label-md text-xs text-emerald-700 dark:text-emerald-300 font-medium">3 Técnicos en guardia</span>
      </div>
    </div>

    <nav class="hidden md:flex space-x-gutter items-center">
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="!text-primary font-bold border-b-2 border-primary pb-1" class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md hover:bg-primary/5 transition-all duration-300 px-1 py-1">Home</a>
      <a routerLink="/hvac-services" routerLinkActive="!text-primary font-bold border-b-2 border-primary pb-1" class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md hover:bg-primary/5 transition-all duration-300 px-1 py-1">HVAC Services</a>
      <a routerLink="/electrical-services" routerLinkActive="!text-primary font-bold border-b-2 border-primary pb-1" class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md hover:bg-primary/5 transition-all duration-300 px-1 py-1">Electrical Services</a>
      <a routerLink="/quote-tool" routerLinkActive="!text-primary font-bold border-b-2 border-primary pb-1" class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md hover:bg-primary/5 transition-all duration-300 px-1 py-1">Quote Tool</a>
      <a routerLink="/booking" routerLinkActive="!text-primary font-bold border-b-2 border-primary pb-1" class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md hover:bg-primary/5 transition-all duration-300 px-1 py-1">Booking</a>
    </nav>

    <div class="hidden md:flex items-center gap-3">
      <!-- Dark / Light Theme Toggle -->
      <button 
        (click)="toggleTheme()" 
        class="w-10 h-10 rounded-xl bg-surface-container/60 dark:bg-surface-variant/30 hover:bg-surface-container-high border border-outline-variant/30 flex items-center justify-center text-on-surface transition-all active:scale-90"
        [title]="themeService.isDark() ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'"
        aria-label="Cambiar tema"
      >
        <span class="material-symbols-outlined text-xl transition-transform duration-300" [class.rotate-180]="themeService.isDark()">
          {{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}
        </span>
      </button>

      <a routerLink="/booking" class="flex items-center justify-center bg-error text-on-error px-4 py-2 rounded-lg font-label-md text-label-md hover:bg-error/90 hover:shadow-lg hover:shadow-error/20 transition-all duration-300 shadow-sm active:scale-95">
        24/7 Emergency
      </a>
    </div>

    <!-- Mobile Action Buttons -->
    <div class="flex md:hidden items-center gap-2">
      <button 
        (click)="toggleTheme()" 
        class="p-2 rounded-lg text-on-surface hover:bg-surface-container"
        aria-label="Cambiar tema"
      >
        <span class="material-symbols-outlined text-xl">
          {{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}
        </span>
      </button>
      <button class="text-primary p-2" (click)="toggleMobileMenu()" aria-label="Abrir menú">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div *ngIf="mobileMenuOpen" class="md:hidden bg-surface/95 dark:bg-surface-container/95 backdrop-blur-xl border-b border-outline-variant/30 px-6 py-4 space-y-3 animate-fade-in-up">
    <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 px-3 py-1.5 rounded-full w-fit mb-3">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="font-label-md text-xs text-emerald-600 dark:text-emerald-300 font-medium">3 Técnicos de guardia en tu zona</span>
    </div>
    <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()" routerLinkActive="text-primary font-bold" class="block text-on-surface-variant hover:text-primary py-2 font-label-md text-label-md">Home</a>
    <a routerLink="/hvac-services" (click)="closeMobileMenu()" routerLinkActive="text-primary font-bold" class="block text-on-surface-variant hover:text-primary py-2 font-label-md text-label-md">HVAC Services</a>
    <a routerLink="/electrical-services" (click)="closeMobileMenu()" routerLinkActive="text-primary font-bold" class="block text-on-surface-variant hover:text-primary py-2 font-label-md text-label-md">Electrical Services</a>
    <a routerLink="/quote-tool" (click)="closeMobileMenu()" routerLinkActive="text-primary font-bold" class="block text-on-surface-variant hover:text-primary py-2 font-label-md text-label-md">Quote Tool</a>
    <a routerLink="/booking" (click)="closeMobileMenu()" routerLinkActive="text-primary font-bold" class="block text-on-surface-variant hover:text-primary py-2 font-label-md text-label-md">Booking</a>
    <a routerLink="/booking" (click)="closeMobileMenu()" class="block text-center bg-error text-on-error py-2.5 rounded-lg font-label-md text-label-md mt-2">
      24/7 Emergency
    </a>
  </div>
</header>
